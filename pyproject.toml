# Why any of this is the way it is: `docs/decisions.md` and the git log.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "isabelle-layout"
version = "0.2.3.dev0"
description = "What structure an Isabelle project has, according to its own files — sessions, theory headers, and project roots read from ROOT files and .thy headers, with no Isabelle process involved."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "András Salamon", email = "Andras.Salamon@st-andrews.ac.uk" },
]
keywords = [
    "isabelle", "isar", "theorem-proving", "formal-verification",
    "afp", "root", "session", "parser",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/ott2/isabelle-layout"
Source = "https://github.com/ott2/isabelle-layout"

[project.scripts]
isabelle-layout = "isabelle_layout._cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "corpus: needs a real Isabelle/AFP checkout on disk (skipped without one)",
]

[tool.hatch.build.targets.wheel]
packages = ["src/isabelle_layout"]

[tool.hatch.build.targets.sdist]
include = ["src/", "docs/", "scripts/", "tests/", "README.md", "LICENSE"]
exclude = ["docs/publishing.md", "scripts/verify_move.py"]
